<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Adzano Elang Saputro - Cloud Engineer Portfolio">
    <title>Adzano Elang Saputro | Cloud Engineer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <div class="container">
            <nav id="nav">
                <ul class="nav-links">
                    <li><a href="#home" class="nav-link active">Home</a></li>
                    <li><a href="#about" class="nav-link">About</a></li>
                    <li><a href="#experience" class="nav-link">Experience</a></li>
                    <li><a href="#certifications" class="nav-link">Certifications</a></li>
                    <li><a href="#projects" class="nav-link">Projects</a></li>
                    <li><a href="#contact" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- Scroll to Top Button -->
    <button id="scroll-to-top" class="scroll-to-top" aria-label="Scroll to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- Hero Section -->
    <section id="home" class="hero-section">
        <div class="container">
            <div class="hero-content">
                <div class="profile-image-container">
                    <img src="img/myprofile.jpeg" alt="Adzano Elang Saputro Profile Picture" class="profile-image">
                </div>
                <div class="hero-text">
                    <h1>Hi, I'm Adzano Elang Saputro</h1>
                    <h2 class="typing-subtitle"><span class="typing-text"></span></h2>
                    <p class="tagline" id="tagline"></p>
                    <div class="social-links" id="hero-social">
                        <!-- Social links will be dynamically inserted -->
                    </div>
                    <a href="#about" class="btn-primary">Learn More</a>
                </div>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section">
        <div class="container">
            <h2 class="section-title">About Me</h2>
            <div class="about-content">
                <div class="bio-container">
                    <p class="bio-text" id="bio-text">
                        <!-- Bio will be dynamically inserted -->
                    </p>
                </div>
                <div class="skills-container">
                    <!-- Skills or highlights can be added here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Experience Section -->
    <section id="experience" class="section">
        <div class="container">
            <h2 class="section-title">Experience</h2>
            <div class="experience-container" id="experience-container">
                <!-- Experience cards will be dynamically inserted -->
            </div>
        </div>
    </section>

    <!-- Certifications Section -->
    <section id="certifications" class="section">
        <div class="container">
            <h2 class="section-title">Certifications</h2>
            <div class="certifications-container" id="certifications-container">
                <!-- Certification cards will be dynamically inserted -->
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="section">
        <div class="container">
            <h2 class="section-title">Projects</h2>
            <div class="projects-container" id="projects-container">
                <!-- Project cards will be dynamically inserted -->
            </div>
        </div>
    </section>

    <!-- Contact/Footer Section -->
    <footer id="contact" class="footer-section">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="footer-social" id="footer-social">
                <!-- Social links will be dynamically inserted -->
            </div>
            <div class="copyright">
                <p>&copy; <span id="current-year"></span> Adzano Elang Saputro. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Typed.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    
    <!-- JavaScript Files -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/navigation.js"></script>
</body>
</html>
